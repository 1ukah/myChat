<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>myChat</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232323"/>
      <stop offset="0.5" stop-color="#080808"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#b4b4b4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>

    <clipPath id="head-clip"><circle cx="512" cy="330" r="150"/></clipPath>
    <clipPath id="body-clip"><path d="M232 848V716A280 180 0 0 1 792 716V848Z"/></clipPath>
  </defs>

  <rect width="1024" height="1024" rx="204" fill="url(#tile)"/>
  <circle cx="512" cy="520" r="470" fill="url(#glow)"/>
  <rect x="5" y="5" width="1014" height="1014" rx="199" fill="none" stroke="url(#edge)" stroke-width="6"/>

  <circle cx="512" cy="330" r="150" fill="url(#skin)"/>
  <path d="M232 848V716A280 180 0 0 1 792 716V848Z" fill="url(#skin)"/>

  <ellipse cx="512" cy="212" rx="210" ry="130" fill="url(#gloss)" clip-path="url(#head-clip)"/>
  <ellipse cx="512" cy="548" rx="350" ry="130" fill="url(#gloss)" clip-path="url(#body-clip)"/>
