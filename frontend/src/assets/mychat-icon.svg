<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>myChat</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a21"/>
      <stop offset="1" stop-color="#1b2838"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.6" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#2a475e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2a475e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Steam's dark navy tile with a soft glow behind the figures. -->
  <rect width="1024" height="1024" rx="64" fill="url(#tile)"/>
  <rect width="1024" height="1024" rx="64" fill="url(#glow)"/>

  <!-- Three people side by side, growing from left to right; together they
       fill 83 % of the tile (87..937 both ways). Each body is a tall block
       with a rounded top; the bodies overlap and their bottoms step down in
       110 px steps. Each head is a "?" close above its body, drawn in a
       100-unit box as a thick hook (stroke 20) and a big dot. -->

  <!-- left, the smallest -->
  <g fill="#c7d5e0" stroke="#c7d5e0">
    <path stroke="none" d="M87 717V542A125 105 0 0 1 337 542V717Z"/>
    <g transform="translate(212 170) scale(2.51)">
      <path fill="none" stroke-width="20" stroke-linejoin="round" d="M-22 32A22 22 0 1 1 15.6 47.6Q2.6 60.6 0 70"/>
      <circle stroke="none" cx="0" cy="87" r="13"/>
    </g>
  </g>
  <!-- middle -->
  <g fill="#96cbea" stroke="#96cbea">
    <path stroke="none" d="M307 827V593A150 126 0 0 1 607 593V827Z"/>
    <g transform="translate(457 129) scale(3.2)">
      <path fill="none" stroke-width="20" stroke-linejoin="round" d="M-22 32A22 22 0 1 1 15.6 47.6Q2.6 60.6 0 70"/>
      <circle stroke="none" cx="0" cy="87" r="13"/>
    </g>
  </g>
  <!-- right, the biggest, in front -->
  <g fill="#66c0f4" stroke="#66c0f4">
    <path stroke="none" d="M577 937V647A180 150 0 0 1 937 647V937Z"/>
    <g transform="translate(757 87) scale(3.9)">
      <path fill="none" stroke-width="20" stroke-linejoin="round" d="M-22 32A22 22 0 1 1 15.6 47.6Q2.6 60.6 0 70"/>
      <circle stroke="none" cx="0" cy="87" r="13"/>
    </g>
  </g>
</svg>
