version: '3'

tasks:
  go:mod:tidy:
    summary: run go mod tidy
    internal: true
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: install the frontend dependencies
    run: once
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    cmds:
      - npm install

  build:frontend:
    summary: build the frontend
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - npm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}} -q
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  generate:bindings:
    summary: make the frontend bindings
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.go"
      - frontend/bindings/**/*
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true -ts

  dev:frontend:
    summary: run the frontend in development mode
    deps:
      - task: install:frontend:deps
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort
